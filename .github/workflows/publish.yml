name: Test and publish bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing so an older run cannot overwrite a newer main image.
concurrency:
  group: bot-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python -m pip check
      - run: python -m pytest -m 'not live' -q
      - run: python -m bot.main --check
      - run: bash -n deploy/update.sh
      - name: Validate server Compose without credentials
        run: |
          cp .env.example .env
          docker compose -f compose.deploy.yml config --quiet

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/imatryx/tt-dowland:main
            ghcr.io/imatryx/tt-dowland:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/iMatryx/TT-Dowland
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
