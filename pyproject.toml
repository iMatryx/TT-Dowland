[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-ultra-downloader"
version = "0.1.0"
description = "Async Telegram bot for verified original-quality public TikTok downloads."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4.0",
    "httpx>=0.27,<0.29",
    "httpcore>=1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.2,<3.0",
    "yt-dlp[default,deno]>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
tiktok-ultra-downloader = "bot.main:main"
tiktok-ultra-download = "bot.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: optional server-side public TikTok/YouTube/Instagram checks; Telegram sends require separate opt-in"]

[tool.setuptools.packages.find]
include = ["bot", "bot.*"]

